[project]
name = "hamster-agent"
version = "0.1.0"
description = "Hamster: a lightweight CLI software engineering agent powered by OpenRouter."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Tanushree Harika Akkula", email = "harika160406@gmail.com" },
]
keywords = [
    "ai", "agent", "cli", "coding-assistant", "openrouter",
    "llm", "software-engineering", "sandbox",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "duckduckgo-search>=6.3.0",
    "rich>=13.9.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
# OS-native keychain token storage: uv pip install "hamster-agent[auth]"
auth = ["keyring>=25.0"]
# Exact BPE token counting (falls back to regex estimator without this)
tiktoken = ["tiktoken>=0.7.0"]

[project.urls]
Homepage   = "https://github.com/TanushreeHarika/Hamster"
Repository = "https://github.com/TanushreeHarika/Hamster"
Issues     = "https://github.com/TanushreeHarika/Hamster/issues"

[project.scripts]
hamster = "hamster.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hamster", "src"]

[tool.hatch.build.targets.sdist]
include = [
    "hamster/",
    "src/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
