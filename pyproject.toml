[project]
name = "hamster-agent"
version = "0.1.0"
description = "Hamster: an extra-lightweight CLI software engineering agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=6.3.0",
    "rich>=13.9.0",
    "requests>=2.32.0",
]

[project.scripts]
hamster = "hamster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hamster", "src"]
